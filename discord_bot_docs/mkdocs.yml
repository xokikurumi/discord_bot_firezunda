site_name: discord_bot ドキュメント
site_description: Discord bot プロジェクト設計・運用ドキュメント

use_directory_urls: true

theme:
  name: material
  language: ja
  features: []

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: plantuml
          class: plantuml
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

nav:
  - ホーム: index.md
  - 要件定義:
      - 概要: requirements/README.md
      - 共通:
          - システム: requirements/common/system.md
          - 非機能: requirements/common/non_functional.md
          - データ: requirements/common/data.md
          - 運用: requirements/common/operations.md
          - 制約: requirements/common/constraints.md
      - 機能:
          - メッセージログ: requirements/features/message_logging.md
          - ボイスログ: requirements/features/voice_logging.md
          - リアクション自動化: requirements/features/reaction_automation.md
          - ダイスロール: requirements/features/dice_roll.md
          - リアクション抽選: requirements/features/reaction_lottery.md
          - 通知先設定: requirements/features/notification_config.md
          - P2PQuake 通知: requirements/features/p2pquake_notification.md
          - Geolonia 住所同期: requirements/features/geolonia_address_sync.md
          - ICS 予定イベント: requirements/features/ics_guild_event.md
          - Niconico ユーザー投稿動画通知: requirements/features/niconico_user_video.md
          - Niconico Info 通知: requirements/features/niconico_info.md
          - Ollama メッセージ分析: requirements/features/ollama_message_analysis.md
          - コミュニケーション傾向分析: requirements/features/communication_trend.md
          - コマンドインターフェース: requirements/features/command_interface.md
      - Geolonia 起動時同期 旧リンク: requirements/geolonia_startup_sync.md
  - コマンド一覧:
      - v2 リアクションコマンド一覧: requirements/reaction_command_list_from_v2.md
      - 最新実装コマンド一覧: requirements/command_list_from_src.md
  - バッチ定義:
      - 概要: batch_definitions/README.md
      - DB 起動時マイグレーション: batch_definitions/batches/database_startup_migration.md
      - P2PQuake WebSocket 監視: batch_definitions/batches/p2pquake_websocket_watch.md
      - 気象庁震度観測点同期: batch_definitions/batches/jma_shindo_station_sync.md
      - ICS 予定イベント取り込み: batch_definitions/batches/ics_guild_event_import.md
      - コミュニケーション傾向分析: batch_definitions/batches/communication_trend_analysis.md
      - Niconico Info 確認: batch_definitions/batches/niconico_info_check.md
      - Niconico ユーザー投稿動画確認: batch_definitions/batches/niconico_user_video_check.md
      - Ollama メッセージ分析: batch_definitions/batches/ollama_message_analysis.md
      - GSI タイルキャッシュ: batch_definitions/batches/gsi_tile_cache.md
      - リリース切替: batch_definitions/batches/release_switch.md
      - DB テーブル定義生成: batch_definitions/batches/db_table_definition_generation.md
      - DB 初期化スクリプト: batch_definitions/batches/db_init_script.md
      - Geolonia 住所同期: batch_definitions/batches/geolonia_address_sync.md
  - 手順:
      - 概要: procedures/README.md
      - 初期セットアップ: procedures/initial_setup.md
      - リリース: procedures/release.md
      - サービス運用: procedures/service_operation.md
      - ロールバック: procedures/rollback.md
      - メンテナンス: procedures/maintenance.md
  - 基本設計:
      - 概要: basic_design/README.md
      - 共通:
          - システム構成: basic_design/common/system_architecture.md
          - 現行ソースコード構成: basic_design/common/source_code_structure.md
          - 起動処理: basic_design/common/startup.md
          - セキュリティ: basic_design/common/security.md
          - 運用: basic_design/common/operations.md
          - 外部連携: basic_design/common/external_integrations.md
          - エラーハンドリング: basic_design/common/error_handling.md
          - データ設計: basic_design/common/data_design.md
      - 機能:
          - Niconico ユーザー投稿動画通知: basic_design/features/niconico_user_video.md
          - Niconico Info 通知: basic_design/features/niconico_info.md
          - メッセージログ: basic_design/features/message_logging.md
          - ICS 予定イベント: basic_design/features/ics_guild_event.md
          - ダイスロール: basic_design/features/dice_roll.md
          - リアクション抽選: basic_design/features/reaction_lottery.md
          - コミュニケーション傾向分析: basic_design/features/communication_trend.md
          - P2PQuake 通知: basic_design/features/p2pquake_notification.md
          - Geolonia 住所同期: basic_design/features/geolonia_address_sync.md
          - Ollama メッセージ分析: basic_design/features/ollama_message_analysis.md
          - 通知先設定: basic_design/features/notification_config.md
          - リアクション自動化: basic_design/features/reaction_automation.md
          - ボイスログ: basic_design/features/voice_logging.md
  - 詳細設計:
      - 概要: detailed_design/README.md
      - 共通:
          - 起動とコンテナ: detailed_design/common/startup_and_container.md
          - DB 初期化: detailed_design/common/database_initialization.md
          - CI/CD: detailed_design/common/cicd.md
      - 機能:
          - ボイスログ: detailed_design/features/voice_logging.md
          - リアクション自動化: detailed_design/features/reaction_automation.md
          - P2PQuake 通知: detailed_design/features/p2pquake_notification.md
          - Geolonia 住所同期: detailed_design/features/geolonia_address_sync.md
          - Ollama メッセージ分析: detailed_design/features/ollama_message_analysis.md
          - 通知先設定: detailed_design/features/notification_config.md
          - Niconico ユーザー投稿動画通知: detailed_design/features/niconico_user_video.md
          - Niconico Info 通知: detailed_design/features/niconico_info.md
          - メッセージログ: detailed_design/features/message_logging.md
          - ICS 予定イベント: detailed_design/features/ics_guild_event.md
          - ダイスロール: detailed_design/features/dice_roll.md
          - リアクション抽選: detailed_design/features/reaction_lottery.md
          - コミュニケーション傾向分析: detailed_design/features/communication_trend.md
  - テーブル定義:
      - 概要: table_definitions/README.md
      - テーブル:
          - コミュニケーション傾向分析: table_definitions/tables/communication_trend_analysis.md
          - リアクションキーワード: table_definitions/tables/b_reaction_keywords.md
