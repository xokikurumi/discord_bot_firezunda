site_name: discord_bot_docs
site_description: Discord bot project documentation

use_directory_urls: true

theme:
  name: material
  features: []

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: plantuml
          class: plantuml
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

nav:
  - Home: index.md
  - Requirements:
      - Overview: requirements/README.md
      - Common:
          - System: requirements/common/system.md
          - Non Functional: requirements/common/non_functional.md
          - Data: requirements/common/data.md
          - Operations: requirements/common/operations.md
          - Constraints: requirements/common/constraints.md
      - Features:
