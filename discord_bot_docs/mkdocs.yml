          - Niconico 動画送信ログ: table_definitions/tables/b_niconico_video_send_log.md
          - Niconico 通知チャンネル設定: table_definitions/tables/b_niconico_notify_cannel_config.md
          - Niconico 動画情報: table_definitions/tables/b_m_niconico_video_infomation.md
          - 気象庁同期状態: table_definitions/tables/b_jma_sync_state.md
          - 気象庁震度観測点: table_definitions/tables/b_jma_shindo_station.md
          - Geolonia 同期状態: table_definitions/tables/b_geolonia_sync_state.md
          - Geolonia 住所: table_definitions/tables/b_geolonia_address.md
          - メッセージ編集ログ: table_definitions/tables/message_edit_log.md
          - メッセージ削除ログ: table_definitions/tables/message_delete_log.md
          - メッセージ分析ログ: table_definitions/tables/message_analysis_log.md
          - メッセージ分析フィードバック: table_definitions/tables/message_analysis_feedback.md
          - メッセージ分析ホワイトリスト: table_definitions/tables/message_analysis_whitelist.md
          - ICS 予定イベント取り込み: table_definitions/tables/ics_guild_event_import.md
          - ICS 予定イベント設定: table_definitions/tables/ics_guild_event_config.md
          - Niconico Info イベント: table_definitions/tables/niconico_info_event.md
          - メッセージログ: table_definitions/tables/message_log.md
          - Discord ユーザー: table_definitions/tables/discord_user.md
